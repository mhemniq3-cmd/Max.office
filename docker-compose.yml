version: '3.8'

services:
  license-server:
    build:
      context: ..
      dockerfile: cloud_server/Dockerfile
    container_name: maxpro_license_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=ChangeThisPassword2026!
      # - MAXPRO_MASTER_PRIVATE_KEY_B64=your_private_key_here
    volumes:
      # Persist SQLite database file outside container
      - ./data:/app/cloud_server/data
